services:
  classical:
    image: nginx:1.30.3-alpine
    container_name: y2q-classical
    command: >
      sh -c "nginx -V 2>&1 | grep -E 'built with OpenSSL 3\.[5-9]' || { echo 'ERROR: OpenSSL 3.5+ required' >&2; exit 1; }; exec nginx -g 'daemon off;'"
    ports:
      - "8443:8443"
    volumes:
      - ./nginx-classical.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  hybrid:
    image: nginx:1.30.3-alpine
    container_name: y2q-hybrid
    command: >
      sh -c "nginx -V 2>&1 | grep -E 'built with OpenSSL 3\.[5-9]' || { echo 'ERROR: OpenSSL 3.5+ required for ML-KEM' >&2; exit 1; }; exec nginx -g 'daemon off;'"
    ports:
      - "9443:8443"
    volumes:
      - ./nginx-hybrid.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
