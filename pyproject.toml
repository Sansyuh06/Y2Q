[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "y2q"
version = "0.1.0"
description = "A read-only TLS 1.3 key-exchange scanner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
y2q = "y2q.cli:main"

[tool.setuptools.packages.find]
include = ["y2q*"]

